# Dashboard Financeiro Pessoal - Schema Summary
# Generated: 2026-02-20
# Status: ✅ COMPLETE & VALIDATED

project:
  name: "Dashboard Financeiro Pessoal"
  technology: "Supabase (PostgreSQL)"
  domain: "Personal Finance Management"
  scope:
    - Transaction tracking (income/expense)
    - Google Sheets sync (daily)
    - Monthly budget planning
    - Financial goal tracking (monthly/yearly)
    - AI chat with financial context
    - Synchronization audit trail

tables:
  transactions:
    purpose: "Record financial transactions (income/expense)"
    rows_per_year: "1000-1200"
    lifecycle: "Mutable, Soft-deletable"
    fields:
      id:
        type: "UUID"
        constraint: "PRIMARY KEY"
        immutable: true
      user_id:
        type: "UUID"
        constraint: "FK → auth.users"
        immutable: true
      amount:
        type: "DECIMAL(15,2)"
        constraint: "NOT NULL, CHECK > 0"
        domain: "Currency value (always positive)"
      type:
        type: "ENUM"
        values: ["income", "expense"]
        constraint: "NOT NULL"
      category:
        type: "TEXT"
        constraint: "NOT NULL"
        domain: "Spending category (e.g., food, transport)"
      description:
        type: "TEXT"
        constraint: "NULL"
      transaction_date:
        type: "DATE"
        constraint: "NOT NULL, CHECK <= CURRENT_DATE"
      source:
        type: "ENUM"
        values: ["manual", "google_sheets"]
        constraint: "NOT NULL DEFAULT 'manual'"
      external_id:
        type: "TEXT"
        constraint: "NULL"
        domain: "Google Sheets row reference"
      sync_id:
        type: "UUID"
        constraint: "FK → sync_logs, SET NULL"
      created_at:
        type: "TIMESTAMPTZ"
        constraint: "NOT NULL DEFAULT NOW()"
        immutable: true
      updated_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
        domain: "Set by trigger on UPDATE"
      deleted_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
        domain: "Soft delete marker"
    indexes:
      - name: "idx_transactions_user_date"
        columns: ["user_id", "transaction_date DESC"]
        partial: "WHERE deleted_at IS NULL"
        purpose: "Time-range queries"
      - name: "idx_transactions_user_category"
        columns: ["user_id", "category"]
        partial: "WHERE deleted_at IS NULL"
        purpose: "Category breakdown"
      - name: "idx_transactions_created"
        columns: ["created_at DESC"]
        partial: "WHERE deleted_at IS NULL"
      - name: "idx_transactions_external_id"
        columns: ["external_id"]
        partial: "WHERE deleted_at IS NULL"
        purpose: "Sync idempotence"
    rls:
      enabled: true
      policy: "users_own (auth.uid() = user_id)"

  budgets:
    purpose: "Monthly spending limits per category"
    rows_per_year: "144-168"
    lifecycle: "Mutable, Soft-deletable"
    fields:
      id:
        type: "UUID"
        constraint: "PRIMARY KEY"
      user_id:
        type: "UUID"
        constraint: "FK → auth.users"
      year_month:
        type: "DATE"
        constraint: "NOT NULL, CHECK day=1"
        domain: "First day of month (YYYY-MM-01)"
      category:
        type: "TEXT"
        constraint: "NOT NULL"
      limit_amount:
        type: "DECIMAL(15,2)"
        constraint: "NOT NULL, CHECK > 0"
      notes:
        type: "TEXT"
        constraint: "NULL"
      created_at:
        type: "TIMESTAMPTZ"
        constraint: "NOT NULL DEFAULT NOW()"
      updated_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
      deleted_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
    constraints:
      - name: "unique_user_month_category"
        columns: ["user_id", "year_month", "category"]
        partial: "WHERE deleted_at IS NULL"
        purpose: "Prevent duplicate budgets"
    indexes:
      - name: "idx_budgets_user_month"
        columns: ["user_id", "year_month DESC"]
        partial: "WHERE deleted_at IS NULL"
      - name: "idx_budgets_user_category"
        columns: ["user_id", "category"]
        partial: "WHERE deleted_at IS NULL"
    rls:
      enabled: true
      policy: "users_own"

  goals:
    purpose: "Financial goals (monthly or yearly targets)"
    rows_per_year: "10-20"
    lifecycle: "Mutable, Status-tracked, Soft-deletable"
    fields:
      id:
        type: "UUID"
        constraint: "PRIMARY KEY"
      user_id:
        type: "UUID"
        constraint: "FK → auth.users"
      title:
        type: "TEXT"
        constraint: "NOT NULL"
      description:
        type: "TEXT"
        constraint: "NULL"
      target_amount:
        type: "DECIMAL(15,2)"
        constraint: "NOT NULL, CHECK > 0"
      current_amount:
        type: "DECIMAL(15,2)"
        constraint: "NOT NULL DEFAULT 0, CHECK 0 <= current <= target"
        domain: "Progress toward target (updated by trigger)"
      period:
        type: "ENUM"
        values: ["monthly", "yearly"]
        constraint: "NOT NULL"
      start_date:
        type: "DATE"
        constraint: "NOT NULL"
      end_date:
        type: "DATE"
        constraint: "NOT NULL"
      status:
        type: "ENUM"
        values: ["active", "completed", "cancelled"]
        constraint: "NOT NULL DEFAULT 'active'"
      completion_date:
        type: "TIMESTAMPTZ"
        constraint: "NULL, required if status='completed'"
      created_at:
        type: "TIMESTAMPTZ"
        constraint: "NOT NULL DEFAULT NOW()"
      updated_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
      deleted_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
    constraints:
      - "CHECK (start_date < end_date)"
      - "CHECK (status = 'completed' implies completion_date IS NOT NULL)"
    indexes:
      - name: "idx_goals_user_status"
        columns: ["user_id", "status"]
        partial: "WHERE deleted_at IS NULL"
      - name: "idx_goals_user_period"
        columns: ["user_id", "period", "start_date DESC"]
        partial: "WHERE deleted_at IS NULL"
      - name: "idx_goals_user_created"
        columns: ["user_id", "created_at DESC"]
        partial: "WHERE deleted_at IS NULL"
    rls:
      enabled: true
      policy: "users_own"

  chat_messages:
    purpose: "Conversation history with AI (immutable)"
    rows_per_year: "1800-7300"
    lifecycle: "Immutable (create-only), Soft-deletable"
    fields:
      id:
        type: "UUID"
        constraint: "PRIMARY KEY"
      user_id:
        type: "UUID"
        constraint: "FK → auth.users"
      message_text:
        type: "TEXT"
        constraint: "NOT NULL"
      role:
        type: "ENUM"
        values: ["user", "assistant"]
        constraint: "NOT NULL"
      context_start_date:
        type: "DATE"
        constraint: "NULL"
        domain: "Start of financial context window"
      context_end_date:
        type: "DATE"
        constraint: "NULL"
        domain: "End of financial context window"
      context_metadata:
        type: "JSONB"
        constraint: "DEFAULT '{}'::jsonb"
        domain: "Category totals, trends, summaries"
      parent_message_id:
        type: "UUID"
        constraint: "FK → chat_messages, SET NULL"
        domain: "Threading support"
      created_at:
        type: "TIMESTAMPTZ"
        constraint: "NOT NULL DEFAULT NOW()"
        immutable: true
      deleted_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
    constraints:
      - "CHECK context_start_date IS NULL OR context_end_date IS NULL OR context_start_date <= context_end_date"
    indexes:
      - name: "idx_chat_user_created"
        columns: ["user_id", "created_at DESC"]
        partial: "WHERE deleted_at IS NULL"
      - name: "idx_chat_user_context"
        columns: ["user_id", "context_start_date", "context_end_date"]
        partial: "WHERE deleted_at IS NULL"
      - name: "idx_chat_parent"
        columns: ["parent_message_id"]
        partial: "WHERE deleted_at IS NULL"
    rls:
      enabled: true
      policy: "users_own"

  sync_logs:
    purpose: "Audit trail of data synchronizations (immutable)"
    rows_per_year: "365"
    lifecycle: "Immutable (append-only)"
    fields:
      id:
        type: "UUID"
        constraint: "PRIMARY KEY"
      user_id:
        type: "UUID"
        constraint: "FK → auth.users"
      sync_type:
        type: "ENUM"
        values: ["google_sheets_transactions", "budget_import", "manual_import"]
        constraint: "NOT NULL"
      status:
        type: "ENUM"
        values: ["success", "failed", "partial"]
        constraint: "NOT NULL"
      records_processed:
        type: "INTEGER"
        constraint: "DEFAULT 0, CHECK >= 0"
      records_inserted:
        type: "INTEGER"
        constraint: "DEFAULT 0, CHECK >= 0"
      records_updated:
        type: "INTEGER"
        constraint: "DEFAULT 0, CHECK >= 0"
      records_failed:
        type: "INTEGER"
        constraint: "DEFAULT 0, CHECK >= 0"
      error_message:
        type: "TEXT"
        constraint: "NULL, required if status='failed'"
      sync_metadata:
        type: "JSONB"
        constraint: "DEFAULT '{}'::jsonb"
        domain: "Source details, parameters, context"
      started_at:
        type: "TIMESTAMPTZ"
        constraint: "NOT NULL DEFAULT NOW()"
        immutable: true
      completed_at:
        type: "TIMESTAMPTZ"
        constraint: "NULL"
    constraints:
      - "CHECK (completed_at IS NULL OR completed_at >= started_at)"
      - "CHECK (records_processed >= records_inserted + records_updated + records_failed)"
    indexes:
      - name: "idx_sync_logs_user_type"
        columns: ["user_id", "sync_type", "completed_at DESC"]
      - name: "idx_sync_logs_user_status"
        columns: ["user_id", "status", "completed_at DESC"]
      - name: "idx_sync_logs_created"
        columns: ["completed_at DESC"]
    rls:
      enabled: true
      policy: "users_own"

relationships:
  user_to_transactions:
    type: "1:N"
    fk: "transactions.user_id → auth.users.id"
    cascade: "CASCADE"
    ownership: "User owns transactions"

  user_to_budgets:
    type: "1:N"
    fk: "budgets.user_id → auth.users.id"
    cascade: "CASCADE"
    ownership: "User owns budgets"

  user_to_goals:
    type: "1:N"
    fk: "goals.user_id → auth.users.id"
    cascade: "CASCADE"
    ownership: "User owns goals"

  user_to_chat_messages:
    type: "1:N"
    fk: "chat_messages.user_id → auth.users.id"
    cascade: "CASCADE"
    ownership: "User owns conversation"

  user_to_sync_logs:
    type: "1:N"
    fk: "sync_logs.user_id → auth.users.id"
    cascade: "CASCADE"
    ownership: "User owns sync history"

  sync_log_to_transactions:
    type: "1:N"
    fk: "transactions.sync_id → sync_logs.id"
    cascade: "SET NULL"
    ownership: "Non-owning reference (audit trail)"

  chat_message_threading:
    type: "1:N (self-referential)"
    fk: "chat_messages.parent_message_id → chat_messages.id"
    cascade: "SET NULL"
    ownership: "Message can have child messages"

  transactions_to_budgets_implicit:
    type: "M:N (no junction table)"
    join_condition: "category + month"
    purpose: "Budget vs actual analysis"

  transactions_to_goals_implicit:
    type: "M:N (no junction table)"
    join_condition: "transaction_date between goal start/end"
    purpose: "Goal progress tracking"

access_patterns:
  dashboard_summary:
    query: "SUM(amount) WHERE user_id AND type AND month"
    indexes: ["idx_transactions_user_date"]
    latency: "5-10ms"
    frequency: "Page load"

  category_breakdown:
    query: "GROUP BY category WHERE user_id"
    indexes: ["idx_transactions_user_category"]
    latency: "10-20ms"
    frequency: "Monthly view"

  budget_vs_actual:
    query: "JOIN transactions t ON category+month = budget"
    indexes: ["idx_transactions_user_category", "idx_budgets_user_month"]
    latency: "20-30ms"
    frequency: "Monthly analysis"

  goal_progress:
    query: "JOIN transactions t WHERE date between start/end"
    indexes: ["idx_goals_user_status", "idx_transactions_user_date"]
    latency: "15-25ms"
    frequency: "Goal view"

  chat_history:
    query: "SELECT * ORDER BY created_at DESC LIMIT 50"
    indexes: ["idx_chat_user_created"]
    latency: "5-10ms"
    frequency: "Chat load"

  sync_audit:
    query: "GROUP BY sync_type, status"
    indexes: ["idx_sync_logs_user_type", "idx_sync_logs_user_status"]
    latency: "5ms"
    frequency: "Admin view"

scaling:
  single_user_10_years:
    transactions: "~10K rows (~2MB)"
    budgets: "~1.5K rows (~0.2MB)"
    goals: "~100 rows (~0.05MB)"
    chat_messages: "~50K rows (~10MB)"
    sync_logs: "~3.6K rows (~0.5MB)"
    total: "~13MB"

  thousand_users_10_years:
    total_storage: "~13GB"
    recommended_strategy: "No partitioning needed"

  ten_thousand_users_10_years:
    total_storage: "~130GB"
    recommended_strategy: "Shard by user_id"

rls_security:
  enabled: true
  pattern: "All tables: auth.uid() = user_id"
  implications:
    - "Users cannot access other users' data"
    - "Cross-user leakage impossible at DB level"
    - "SELECT, INSERT, UPDATE, DELETE all controlled"
    - "Application cannot bypass RLS"

soft_deletes:
  tables:
    - transactions
    - budgets
    - goals
    - chat_messages
  immutable_tables:
    - sync_logs
  rationale:
    - "Preserve history"
    - "Support undo/recovery"
    - "Audit trail maintenance"
  implementation: "deleted_at field + partial indexes"

constraints_summary:
  primary_keys: "5/5 tables"
  foreign_keys: "8/8 relationships"
  unique_constraints: "1 (budgets.user_month_category)"
  check_constraints: "12+ covering domains"
  not_null_constraints: "On critical fields"
  triggers: "5 (updated_at maintenance + immutability)"

migration:
  file: "supabase/migrations/20260220120000_initial_schema.sql"
  size: "~2000 lines"
  execution_time: "< 5 seconds"
  status: "✅ Ready to apply"

